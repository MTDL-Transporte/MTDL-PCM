name: Deploy to VPS (MTDL-PCM)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Test SSH connectivity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 600s
          script_stop: true
          script: |
            echo "Connected"
            hostname || true
            uname -a || true
            ls -la /root || true

      - name: Ensure target directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 600s
          script_stop: true
          script: |
            mkdir -p /root/mtdlpcm

      - name: Upload project to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          source: "."
          target: "/root/mtdlpcm"
          rm: true
          strip_components: 0
          debug: true
          timeout: 600s

      - name: Deploy containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 600s
          script_stop: true
          script: |
            set -e
            cd /root/mtdlpcm
            docker compose down || true
            docker compose up -d --build
            docker compose ps
            curl -I http://localhost/health || true

      - name: Restart Nginx and check health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          timeout: 600s
          script_stop: true
          script: |
            set -e
            cd /root/mtdlpcm
            docker compose restart nginx
            curl -I http://localhost/health || true
